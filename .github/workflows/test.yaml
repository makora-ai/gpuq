name: Primary checks

permissions:
  contents: read
  checks: write

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Mypy and tests
    timeout-minutes: 5
    strategy:
      max-parallel: 5
      matrix:
        python_version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-22.04, ubuntu-24.04, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup python ${{ matrix.python_version }} and env
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
          cache: 'pip' # caching pip dependencies

      - name: Create virtual env
        run: |
          python -m venv .venv

      - name: Install package with dependencies
        run: |
          source .venv/bin/activate
          pip install -e '.[dev]'
          mkdir -p junit

      - name: Mypy
        run: |
          source .venv/bin/activate
          mypy --strict gpuq tests --junit-xml=junit/mypy-results.xml

      - name: Tests
        run: |
          source .venv/bin/activate
          pytest tests/ --junitxml=junit/test-results.xml

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: '**/junit/*.xml'
  

  final_status_check:
    name: Final result
    if: ${{ always() }}
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        # see https://stackoverflow.com/a/67532120/4907315
        if: >-
          ${{
               contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
            || contains(needs.*.result, 'skipped')
          }}


  sbom_sources:
    name: SBOM
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.24.3
        with:
          syft-version: v1.55.0

      - name: Generate SBOMs
        env:
          SOURCE_VERSION: ${{ github.sha }}
        run: bash scripts/sbom.sh sbom >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom-sources-${{ github.sha }}
          path: sbom/
          retention-days: 90


  dependency_track_upload:
    name: Upload SBOMs to Dependency-Track
    environment: dtrack
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [sbom_sources]
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: 'sbom-sources-${{ github.sha }}', path: sbom/ }

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gh-actions-ci

      - name: Upload SBOMs to Dependency-Track
        env:
          DT_URL: ${{ secrets.DEPENDENCYTRACK_URL }}
          DT_API_KEY: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
        run: |
          # <dtrack project>:<file in sbom/ without .cdx.json>, one per project.
          failed=0
          for pair in gpuq:gpuq; do
            project="${pair%%:*}" file="sbom/${pair#*:}.cdx.json"
            if [ ! -f "$file" ]; then
              echo "::warning::$file missing, $project not uploaded"; failed=1; continue
            fi
            curl -fsS --retry 3 --retry-all-errors -X POST "${DT_URL%/}/api/v1/bom" \
              -H "X-Api-Key: $DT_API_KEY" -F autoCreate=true \
              -F "projectName=$project" -F projectVersion=main \
              -F "bom=@$file" || failed=1
            echo
          done
          exit $failed


  build-wheels:
    name: Build wheels
    needs: [tests]
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
    timeout-minutes: 5
    runs-on: ${{ matrix.os }}

    strategy:
      max-parallel: 4
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]

    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        if: runner.os == 'Linux' && runner.arch == 'X64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.1

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
